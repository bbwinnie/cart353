<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twinkle Twinkle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Twinkle Twinkle</h1>

    <div id="gameContainer">

        <canvas id="gameCanvas"></canvas>

        <div id="themeIntro">
            <h2 id="themeTitle"></h2>
            <p id="themeText"></p>
            <button id="startThemeBtn">Continue</button>
        </div>

        <div id="themeDisplay">
            theme:<span id="currentTheme"></span>
        </div>

        <div id="choiceBox">
            <h2 id="characterName"> </h2>
            <div id="choiceContainer"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
